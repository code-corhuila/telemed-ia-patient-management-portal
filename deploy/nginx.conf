server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # CORS: the shell (telemed-ia-front) is served from a different origin and
    # fetches this portal's remoteEntry.json and chunks directly.
    # -------------------------------------------------------------------------

    set $cors_origin "";

    if ($http_origin ~* "^http://localhost:(4200|4201)$") {
        set $cors_origin $http_origin;
    }
    if ($http_origin ~* "^https://[a-z0-9-]+\.telemed-ia\.[a-z]+$") {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Vary "Origin" always;

    # -------------------------------------------------------------------------
    # SPA fallback: any unknown path serves index.html so client-side routing
    # works when the portal runs standalone.
    # -------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Federation artifacts must never be cached: they decide which version of
    # this portal the shell loads.
    # -------------------------------------------------------------------------

    location ~* (remoteEntry\.json|federation\.manifest\.json)$ {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
        try_files $uri =404;
    }

    # Long cache for hashed chunks produced by the Angular build.
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary "Origin" always;
    }
}